name: Validate marketplace

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Install pinned tooling
        run: npm ci --ignore-scripts
      - name: Extract merge-base registry lock
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          case "$BASE_SHA" in
            ''|*[!0-9a-fA-F]*)
              printf '%s\n' 'BASE_SHA must be a full hexadecimal Git object id' >&2
              exit 1
              ;;
          esac
          OBJECT_FORMAT="$(git rev-parse --show-object-format)"
          case "$OBJECT_FORMAT" in
            sha1) OBJECT_ID_LENGTH=40 ;;
            sha256) OBJECT_ID_LENGTH=64 ;;
            *)
              printf '%s\n' 'unsupported Git object format' >&2
              exit 1
              ;;
          esac
          if [ "${#BASE_SHA}" -ne "$OBJECT_ID_LENGTH" ]; then
            printf '%s\n' 'BASE_SHA must be a full hexadecimal Git object id' >&2
            exit 1
          fi
          BASE_COMMIT="$(git rev-parse --verify --end-of-options "${BASE_SHA}^{commit}")"
          case "$BASE_COMMIT" in
            ''|*[!0-9a-f]*)
              printf '%s\n' 'base commit did not resolve to a full object id' >&2
              exit 1
              ;;
          esac
          if [ "${#BASE_COMMIT}" -ne "$OBJECT_ID_LENGTH" ]; then
            printf '%s\n' 'base commit did not resolve to a full object id' >&2
            exit 1
          fi
          REGISTRY_BASE_COMMIT="$(git merge-base -- HEAD "$BASE_COMMIT")"
          case "$REGISTRY_BASE_COMMIT" in
            ''|*[!0-9a-f]*)
              printf '%s\n' 'merge base did not resolve to a full object id' >&2
              exit 1
              ;;
          esac
          if [ "${#REGISTRY_BASE_COMMIT}" -ne "$OBJECT_ID_LENGTH" ]; then
            printf '%s\n' 'merge base did not resolve to a full object id' >&2
            exit 1
          fi
          LOCK_ENTRY="$(git ls-tree "$REGISTRY_BASE_COMMIT" -- registry/lock.json)"
          if [ -n "$LOCK_ENTRY" ]; then
            LOCK_MODE="${LOCK_ENTRY%% *}"
            if [ "$LOCK_MODE" != '100644' ]; then
              printf '%s\n' 'merge-base registry lock must be a regular non-executable file' >&2
              exit 1
            fi
            git cat-file blob "${REGISTRY_BASE_COMMIT}:registry/lock.json" \
              > "$RUNNER_TEMP/gravit-base-lock.json"
          else
            printf '%s\n' '{"plugins":{}}' > "$RUNNER_TEMP/gravit-base-lock.json"
          fi
      - name: Validate version identity
        if: github.event_name == 'pull_request'
        run: node scripts/validate.mjs --compare-lock "$RUNNER_TEMP/gravit-base-lock.json"
      - name: Run offline tests and registry validation
        run: |
          npm test
          npm run validate
          npm run registry:verify
      - name: Verify deterministic generation
        run: |
          npm run plugins:sync
          git diff --exit-code -- registry .claude-plugin .agents plugins
      - name: Build release archives
        run: npm run build

  client-smoke:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Install exact client CLIs without package lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Prepare the exact Claude native wrapper
        run: node node_modules/@anthropic-ai/claude-code/install.cjs
      - name: Smoke test supported clients against local bundles
        run: npm run smoke:clients
