name: Validate marketplace

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Install pinned tooling
        run: npm ci --ignore-scripts
      - name: Run offline tests and registry validation
        run: |
          npm test
          npm run validate
          npm run registry:verify
      - name: Verify deterministic generation
        run: |
          npm run plugins:sync
          git diff --exit-code -- registry .claude-plugin .agents plugins
      - name: Build release archives
        run: npm run build

  client-smoke:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Install exact client CLIs without package lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Prepare the exact Claude native wrapper
        run: node node_modules/@anthropic-ai/claude-code/install.cjs
      - name: Smoke test supported clients against local bundles
        run: npm run smoke:clients
